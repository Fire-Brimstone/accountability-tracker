<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Methodology</title>
<link rel="stylesheet" href="styles.css">
<style>
  #doc { max-width: 760px; } #doc table { margin: 10px 0; } #doc code { background: var(--chip); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <h1><a href="index.html">Public Record Monitor</a></h1>
  <nav><a href="index.html">Officials</a><a href="methodology.html">Methodology</a></nav>
</div></header>
<main class="wrap"><article id="doc"><p class="muted">Loading…</p></article></main>
<footer><div class="wrap"></div></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
import { footer } from "./common.js";
const md = await (await fetch("METHODOLOGY.md")).text();
const doc = document.getElementById("doc");
doc.innerHTML = marked.parse(md);
doc.querySelectorAll("h1,h2,h3").forEach((h) => {
  h.id = h.textContent.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
});
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
footer();
</script>
</body>
</html>
